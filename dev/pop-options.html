<!doctype html>
<meta charset="utf-8">
<title>Flyer pop — options</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
 :root{
   --paper:#f1ece0; --paper-2:#e7e0cf; --ink:#161311; --ink-soft:#3a342f;
   --red:#d6233a; --yellow:#f5c518; --teal:#1f6f8b; --shadow:6px 6px 0 var(--ink);
 }
 *{box-sizing:border-box;}
 body{
   margin:0;padding:28px 24px 60px;background:var(--paper);color:var(--ink);
   font-family:"Spectral",Georgia,serif;
   background-image:radial-gradient(var(--paper-2) 1px, transparent 1px);
   background-size:14px 14px;
 }
 h1{font-family:"Anton",Impact,sans-serif;font-size:1.5rem;letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;}
 .lede{font-size:.9rem;color:var(--ink-soft);margin:0 0 18px;max-width:70ch;}
 .bar{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
 button.ctl{
   font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
   background:var(--ink);color:var(--paper);border:0;padding:9px 14px;cursor:pointer;
 }
 button.ctl.alt{background:var(--paper);color:var(--ink);border:2px solid var(--ink);}
 label.speed{font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;}

 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;max-width:820px;}
 .cell{background:var(--paper-2);border:3px solid var(--ink);padding:14px 14px 16px;}
 .cell h2{font-family:"Anton",Impact,sans-serif;font-size:1.05rem;margin:0 0 2px;text-transform:uppercase;letter-spacing:.02em;}
 .cell p{font-size:.8rem;color:var(--ink-soft);margin:0 0 12px;min-height:2.6em;line-height:1.45;}
 .cell .go{
   font-family:"Space Mono",monospace;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;
   background:none;border:2px solid var(--ink);padding:6px 10px;cursor:pointer;margin-top:12px;
 }

 /* ---- the mock flyer: same proportions as the real sheet (.8 w/h) ---- */
 .stage{position:relative;height:280px;display:grid;place-items:center;}
 .sheet-wrap{position:relative;width:184px;height:230px;}
 .sheet{
   position:absolute;inset:0;border:4px solid var(--ink);background:var(--paper);
   box-shadow:var(--shadow);overflow:hidden;
   transition:opacity var(--exit) ease, transform var(--exit) ease;
 }
 .sheet .band{position:absolute;inset:0;background:
    linear-gradient(180deg,#2a2523 0 26%, var(--yellow) 26% 100%);}
 .sheet .tab{position:absolute;left:9%;width:34%;height:9%;background:var(--red);border:2px solid rgba(0,0,0,.35);}
 .sheet .row{position:absolute;left:48%;width:44%;height:9%;background:#fbeaa8;border:2px solid rgba(0,0,0,.25);}
 .sheet .ttl{position:absolute;left:8%;top:7%;width:64%;height:5%;background:#f6f1e6;opacity:.85;}
 .sheet .ttl.b{top:14%;width:48%;}
 /* a whisper of a swell on the way out, the way a bubble goes: shrinking reads as
    retreating, which is the thing we're trying to get rid of */
 .gone .sheet{opacity:0;transform:scale(1.012);}

 /* the pop layer sits over the sheet, clipped by nothing */
 .fx{position:absolute;inset:0;pointer-events:none;opacity:0;}
 .fx svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible;}
 .playing .fx{opacity:1;}

 .rim{fill:none;stroke:var(--ink);stroke-width:2.2;}
 .drop{fill:var(--ink);}
 .drop.soft{fill:var(--ink-soft);}

 /* ============ A: bubble skin ============ */
 @keyframes skinA{
   0%{opacity:.95;transform:scale(1);}
   100%{opacity:0;transform:scale(1.055);}
 }
 @keyframes dropA{
   0%{opacity:.9;transform:translate(0,0) scale(1);}
   100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35);}
 }
 .playing .a .rim{animation:skinA calc(260ms * var(--k)) cubic-bezier(.2,.75,.3,1) both;transform-origin:center;transform-box:fill-box;}
 .playing .a .drop{animation:dropA calc(300ms * var(--k)) cubic-bezier(.15,.7,.35,1) both;transform-origin:center;transform-box:fill-box;}

 /* ============ B: rim shatter ============ */
 @keyframes skinB{
   0%{opacity:1;transform:scale(1);}
   100%{opacity:0;transform:scale(1.05);}
 }
 .playing .b .rim{
   stroke-dasharray:11 9;stroke-linecap:round;
   animation:skinB calc(250ms * var(--k)) cubic-bezier(.2,.8,.3,1) both;
   transform-origin:center;transform-box:fill-box;
 }
 .playing .b .drop{animation:dropA calc(290ms * var(--k)) cubic-bezier(.15,.7,.35,1) both;transform-origin:center;transform-box:fill-box;}

 /* ============ C: droplet spray only ============ */
 @keyframes dropC{
   0%{opacity:0;transform:translate(0,0) scale(.5);}
   18%{opacity:.85;transform:translate(calc(var(--dx) * .28),calc(var(--dy) * .28)) scale(1);}
   100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}
 }
 .playing .c .drop{animation:dropC calc(320ms * var(--k)) cubic-bezier(.18,.72,.3,1) both;transform-origin:center;transform-box:fill-box;}

 /* ============ D: corner flick ============ */
 @keyframes dropD{
   0%{opacity:.85;transform:translate(0,0) scale(.9);}
   100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5);}
 }
 .playing .d .drop{animation:dropD calc(260ms * var(--k)) cubic-bezier(.2,.75,.3,1) both;transform-origin:center;transform-box:fill-box;}
 .playing .d .rim{
   stroke-dasharray:0 1000;stroke-linecap:round;
   animation:skinB calc(220ms * var(--k)) ease-out both;transform-origin:center;transform-box:fill-box;
 }
</style>

<h1>Flyer pop — four quieter options</h1>
<p class="lede">Each mock sheet stands in for the unrolled flyer (same proportions). Click a card, or Play all,
to watch it pop shut. Slow motion helps to see the shape of it; judge the final feel at 1×.</p>

<div class="bar">
  <button class="ctl" id="all">▶ Play all</button>
  <label class="speed"><input type="radio" name="k" value="1" checked> 1×</label>
  <label class="speed"><input type="radio" name="k" value="3"> 3× slow</label>
  <label class="speed"><input type="radio" name="k" value="6"> 6× slow</label>
  <button class="ctl alt" id="reset">Reset</button>
</div>

<div class="grid" id="grid"></div>

<script>
const W = 184, H = 230;      // mock sheet, .8 ratio like the real one
const PAD = 34;              // svg breathing room for outward travel

// points spread around the sheet's perimeter, each with an outward normal
function rim(n, jitter, rnd){
  const per = 2*(W+H), out = [];
  for(let i=0;i<n;i++){
    let d = (i + rnd()*jitter - jitter/2) / n * per;
    d = (d + per) % per;
    let x,y,nx,ny;
    if(d < W){ x=d; y=0; nx=0; ny=-1; }
    else if(d < W+H){ x=W; y=d-W; nx=1; ny=0; }
    else if(d < 2*W+H){ x=W-(d-W-H); y=H; nx=0; ny=1; }
    else { x=0; y=H-(d-2*W-H); nx=-1; ny=0; }
    // nudge the normal at the corners so they spray diagonally
    const cx = x < W*.16 ? -1 : x > W*.84 ? 1 : 0;
    const cy = y < H*.13 ? -1 : y > H*.87 ? 1 : 0;
    if(cx && cy){ nx = cx*.72; ny = cy*.72; }
    out.push({x,y,nx,ny});
  }
  return out;
}
function mulberry(seed){ return function(){ seed|=0; seed = seed+0x6D2B79F5|0;
  let t = Math.imul(seed^seed>>>15, 1|seed); t = t+Math.imul(t^t>>>7, 61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}

function drops(pts, rnd, {rMin, rMax, dMin, dMax, soft=0}){
  return pts.map((p,i)=>{
    const r = rMin + rnd()*(rMax-rMin);
    const dist = dMin + rnd()*(dMax-dMin);
    const wob = (rnd()-.5)*.5;                       // splay a little off the normal
    const dx = (p.nx + wob*-p.ny) * dist, dy = (p.ny + wob*p.nx) * dist;
    const cls = (soft && rnd() < soft) ? 'drop soft' : 'drop';
    const delay = (rnd()*40).toFixed(0);
    return `<circle class="${cls}" cx="${(p.x+PAD).toFixed(1)}" cy="${(p.y+PAD).toFixed(1)}" r="${r.toFixed(2)}"
      style="--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;animation-delay:calc(${delay}ms * var(--k))"/>`;
  }).join('');
}

const OPTS = [
  { id:'a', name:'A · Bubble skin',
    note:'The sheet’s own outline lifts off, swells 5% and is gone, with a light scatter of droplets off the edge.',
    build(){ const rnd = mulberry(3); const pts = rim(16, .8, rnd);
      return `<rect class="rim" x="${PAD}" y="${PAD}" width="${W}" height="${H}" rx="3"/>`
           + drops(pts, rnd, {rMin:1.4, rMax:3.4, dMin:9, dMax:19, soft:.35}); } },

  { id:'b', name:'B · Rim shatter',
    note:'The outline breaks into dashes first, so the edge reads as coming apart rather than expanding.',
    build(){ const rnd = mulberry(9); const pts = rim(14, .9, rnd);
      return `<rect class="rim" x="${PAD}" y="${PAD}" width="${W}" height="${H}" rx="3"/>`
           + drops(pts, rnd, {rMin:1.2, rMax:3, dMin:8, dMax:17, soft:.4}); } },

  { id:'c', name:'C · Droplet spray',
    note:'No outline at all. Only a fine mist off the perimeter, popping outward and gone. The quietest.',
    build(){ const rnd = mulberry(21); const pts = rim(26, 1, rnd);
      return drops(pts, rnd, {rMin:1, rMax:2.8, dMin:7, dMax:20, soft:.5}); } },

  { id:'d', name:'D · Corner flick',
    note:'Eight ticks only, at the corners and edge midpoints. Barely there — a suggestion of a pop.',
    build(){ const rnd = mulberry(5);
      const pts = [{x:0,y:0,nx:-.72,ny:-.72},{x:W,y:0,nx:.72,ny:-.72},
                   {x:W,y:H,nx:.72,ny:.72},{x:0,y:H,nx:-.72,ny:.72},
                   {x:W/2,y:0,nx:0,ny:-1},{x:W,y:H/2,nx:1,ny:0},
                   {x:W/2,y:H,nx:0,ny:1},{x:0,y:H/2,nx:-1,ny:0}];
      return drops(pts, rnd, {rMin:1.8, rMax:3.2, dMin:11, dMax:18, soft:.25}); } },
];

const grid = document.getElementById('grid');
grid.innerHTML = OPTS.map(o => `
  <div class="cell">
    <h2>${o.name}</h2>
    <p>${o.note}</p>
    <div class="stage" data-id="${o.id}">
      <div class="sheet-wrap ${o.id}">
        <div class="sheet">
          <div class="band"></div>
          <div class="ttl"></div><div class="ttl b"></div>
          <div class="tab" style="top:32%"></div><div class="row" style="top:32%"></div>
          <div class="tab" style="top:44%"></div><div class="row" style="top:44%"></div>
          <div class="tab" style="top:56%"></div><div class="row" style="top:56%"></div>
          <div class="tab" style="top:68%"></div><div class="row" style="top:68%"></div>
          <div class="tab" style="top:80%"></div><div class="row" style="top:80%"></div>
        </div>
        <div class="fx">
          <svg width="${W+PAD*2}" height="${H+PAD*2}" viewBox="0 0 ${W+PAD*2} ${H+PAD*2}">${o.build()}</svg>
        </div>
      </div>
    </div>
    <button class="go" data-play="${o.id}">▶ Pop it</button>
  </div>`).join('');

let k = 1;
document.querySelectorAll('input[name=k]').forEach(r =>
  r.addEventListener('change', e => { k = +e.target.value; document.body.style.setProperty('--k', k); }));
document.body.style.setProperty('--k', 1);

function play(id){
  const wrap = document.querySelector('.sheet-wrap.' + id);
  wrap.classList.remove('playing','gone');
  void wrap.offsetWidth;
  wrap.style.setProperty('--exit', (110 * k) + 'ms');
  wrap.classList.add('playing','gone');
  clearTimeout(wrap._t);
  wrap._t = setTimeout(() => wrap.classList.remove('playing','gone'), 900 * k);
}
document.querySelectorAll('[data-play]').forEach(b =>
  b.addEventListener('click', () => play(b.dataset.play)));
document.querySelectorAll('.stage').forEach(s =>
  s.addEventListener('click', () => play(s.dataset.id)));
document.getElementById('all').addEventListener('click', () => OPTS.forEach(o => play(o.id)));
document.getElementById('reset').addEventListener('click', () =>
  document.querySelectorAll('.sheet-wrap').forEach(w => w.classList.remove('playing','gone')));
</script>
